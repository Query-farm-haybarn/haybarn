name: Extension Build and Deploy
on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
      extension_config:
        required: true
        type: string
      exclude_archs:
        required: false
        type: string
        default: ''
      opt_in_archs:
        required: false
        type: string
        default: ''
      extra_toolchains:
        required: false
        type: string
        default: ""
      override_duckdb_version:
        required: false
        type: string
        default: ""
      override_tag:
        required: false
        type: string
        default: ""
      skip_tests:
        required: false
        type: boolean
        default: false
      save_cache:
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    # Haybarn: pinned to the v1.5-variegata SHA at the time of pinning so the
    # build is reproducible. Roll forward intentionally (look up the current
    # `v1.5-variegata` SHA on duckdb/extension-ci-tools and update here).
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@4b3b37b0c9de00da54e1765d65abfea3f94617f4
    with:
      # We piggy-back extension-template to build the extensions in extension_config, it's hacky, but it works ¯\_(ツ)_/¯
      override_repository: duckdb/extension-template
      override_ref: main

      # Note when `upload_all_extensions` is true, the extension name is used as prefix to the artifact holding all built extensions
      upload_all_extensions: true
      extension_name: ${{ inputs.artifact_prefix }}

      # DuckDB version is overridden to the current commit of the current repository
      set_caller_as_duckdb: true
      duckdb_version: ${{ inputs.override_duckdb_version != '' && inputs.override_duckdb_version || github.sha }}

      # Haybarn: extension-ci-tools also pinned to a SHA (matches the uses: above).
      override_ci_tools_repository: duckdb/extension-ci-tools
      ci_tools_version: 4b3b37b0c9de00da54e1765d65abfea3f94617f4

      exclude_archs: ${{ inputs.exclude_archs }}
      opt_in_archs: ${{ inputs.opt_in_archs }}

      extra_toolchains: ${{ inputs.extra_toolchains }}
      use_merged_vcpkg_manifest: '1'

      # Haybarn vcpkg binary cache: still read from DuckDB's public cache (free
      # hits for shared deps), and read+write our own R2-backed cache via a
      # Cloudflare Worker that bearer-auths writes.
      # Worker source: ~/Development/haybarn/haybarn-vcpkg-worker
      vcpkg_binary_sources: "clear;http,https://vcpkg-cache.duckdb.org,read;http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer ${{ secrets.HAYBARN_VCPKG_TOKEN }}"

      duckdb_tag: ${{ inputs.override_tag }}

      skip_tests: ${{ inputs.skip_tests }}
      save_cache: ${{ inputs.save_cache }}

      # This forces tests to be run for all extensions in the config
      extensions_test_selection: 'complete'
      # The extension_config.cmake configuration that gets built
      extra_extension_config: ${{ inputs.extension_config }}
# Haybarn fork — workflow re-index marker.
