name: Extension Build and Deploy
on:
  workflow_call:
    inputs:
      artifact_prefix:
        required: true
        type: string
      extension_config:
        required: true
        type: string
      exclude_archs:
        required: false
        type: string
        default: ''
      opt_in_archs:
        required: false
        type: string
        default: ''
      extra_toolchains:
        required: false
        type: string
        default: ""
      override_duckdb_version:
        required: false
        type: string
        default: ""
      override_tag:
        required: false
        type: string
        default: ""
      skip_tests:
        required: false
        type: boolean
        default: false
      save_cache:
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build
    # Haybarn fork of extension-ci-tools, pinned by SHA. The fork carries one
    # patch: accept the vcpkg bearer token via `secrets.vcpkg_token` and
    # substitute it into the binary-sources URL via the `{0}` placeholder
    # (works around GH Actions blocking `secrets` in `with:` of nested
    # workflow_call).
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_distribution.yml@3d2415622fa62161311da3540187548e602fda0e
    with:
      # We piggy-back extension-template to build the extensions in extension_config, it's hacky, but it works ¯\_(ツ)_/¯
      override_repository: duckdb/extension-template
      override_ref: main

      # Note when `upload_all_extensions` is true, the extension name is used as prefix to the artifact holding all built extensions
      upload_all_extensions: true
      extension_name: ${{ inputs.artifact_prefix }}

      # DuckDB version is overridden to the current commit of the current repository
      set_caller_as_duckdb: true
      duckdb_version: ${{ inputs.override_duckdb_version != '' && inputs.override_duckdb_version || github.sha }}

      # Match the `uses:` above so the cloned CI tools tree matches the called workflow.
      override_ci_tools_repository: Query-farm-haybarn/haybarn-extension-ci-tools
      ci_tools_version: 3d2415622fa62161311da3540187548e602fda0e

      exclude_archs: ${{ inputs.exclude_archs }}
      opt_in_archs: ${{ inputs.opt_in_archs }}

      extra_toolchains: ${{ inputs.extra_toolchains }}
      use_merged_vcpkg_manifest: '1'

      # Haybarn vcpkg binary cache. The `{0}` placeholder is replaced inside the
      # extension-ci-tools fork with the bearer token (passed via the secrets
      # block below). Self-contained — we don't read from duckdb.org's cache.
      # Worker source: ~/Development/haybarn/haybarn-vcpkg-worker
      vcpkg_binary_sources: "clear;http,https://haybarn-vcpkg-cache.rusty-bb6.workers.dev,readwrite,Authorization: Bearer {0}"

      duckdb_tag: ${{ inputs.override_tag }}

      skip_tests: ${{ inputs.skip_tests }}
      save_cache: ${{ inputs.save_cache }}

      # This forces tests to be run for all extensions in the config
      extensions_test_selection: 'complete'
      # The extension_config.cmake configuration that gets built
      extra_extension_config: ${{ inputs.extension_config }}
    # Pass the bearer token to the haybarn fork of extension-ci-tools, which
    # substitutes it into the `{0}` placeholder in vcpkg_binary_sources.
    # `secrets:` is the ONE place GH Actions allows `${{ secrets.X }}` to flow
    # into a nested workflow_call; `with:` is blocked.
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
# Haybarn fork — workflow re-index marker.
