# Haybarn 2.0 core extension build.
#
# Builds upstream 2.0's extension groups (core, cloud, search, scanner, rust)
# through the Haybarn ci-tools build.yml against this engine, with the
# httpfs/iceberg/ducklake/delta build-forks in the cloud and rust groups. Every
# run then dry-runs haybarn-extensions-publish.yml on its own artifacts; real
# publishing is a manual dispatch of that workflow against a tag build.
#
# Triggers: haybarn-v2.* tags build every group on every architecture; pushes
# to next-2.0 build the smoke group on the reduced architecture set; dispatch
# chooses the groups.
name: Haybarn Extensions (2.0)

on:
  push:
    branches:
      - next-2.0
    tags:
      - 'haybarn-v2.[0-9]+.[0-9]+*'
    paths:
      - '.github/config/haybarn_extensions_next_2_0.cmake'
      - '.github/config/haybarn/**'
      - '.github/workflows/haybarn-extensions.yml'
      - '.github/workflows/haybarn-extensions-publish.yml'
      - 'extension/**'
      - 'src/**'
      - 'tools/shell/**'
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'Haybarn engine ref to build against. Defaults to the workflow commit.'
        type: string
      duckdb_version:
        description: 'DuckDB-compatible version to embed, e.g. v2.0.0. Empty derives it like upstream (vX.Y.0-devN).'
        type: string
      skip_tests:
        description: 'Build artifacts without running extension tests.'
        type: boolean
        default: false
      groups:
        description: 'Comma-separated extension groups: smoke, core, cloud, search, scanner, rust, or all.'
        type: string
        default: smoke
      full_matrix:
        description: 'Build every architecture a tag build does (reduced_ci_mode disabled), e.g. to include osx_arm64.'
        type: boolean
        default: false

concurrency:
  group: haybarn-extensions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Select version and groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.select.outputs.groups }}
      duckdb_version: ${{ steps.version.outputs.duckdb_version }}
      duckdb_commit: ${{ steps.version.outputs.duckdb_commit }}
      tag_build: ${{ steps.version.outputs.tag_build }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.engine_ref || github.sha }}
          # version.py counts commits for the -devN iteration.
          fetch-depth: 0
          filter: blob:none
      # The embedded DuckDB version decides extension compatibility and the
      # repository folder: ci-tools exports it as DUCKDB_VERSION, which the
      # engine's CMake prefers over OVERRIDE_GIT_DESCRIBE. A haybarn-vX.Y.Z[-rcN]
      # tag embeds vX.Y.Z (what that engine reports); otherwise upstream's
      # scripts/ci/version.py derives vX.Y.0-devN, filed under the commit hash.
      - id: version
        env:
          INPUT_VERSION: ${{ inputs.duckdb_version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          tag_build=false
          if [[ -z "$version" && "$REF_TYPE" == tag && "$REF_NAME" =~ ^haybarn-(v[0-9]+\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
            version="${BASH_REMATCH[1]}"
            tag_build=true
          fi
          python3 scripts/ci/version.py --duckdb-commit "$(git rev-parse HEAD)" --duckdb-version "$version" --github-output >> "$GITHUB_OUTPUT"
          echo "tag_build=$tag_build" >> "$GITHUB_OUTPUT"
          sed -n 's/^duckdb_/Using duckdb_/p' "$GITHUB_OUTPUT"
      - id: select
        env:
          REQUESTED: ${{ inputs.groups || (github.ref_type == 'tag' && 'all') || 'smoke' }}
        # Upstream Main.yml's groups, with cloud and rust swapped for the Haybarn
        # variants that build the httpfs/iceberg/ducklake/delta build-forks.
        run: |
          set -euo pipefail
          requested=",${REQUESTED// /},"
          [[ "$requested" == ",all," ]] && requested=",core,cloud,search,scanner,rust,"
          emit() { [[ "$requested" == *",$1,"* ]] && printf '%s\n' "$2"; return 0; }
          {
            echo 'groups<<HAYBARN_GROUPS_EOF'
            emit smoke   $'haybarn-2-0:\n  config: duckdb/.github/config/haybarn_extensions_next_2_0.cmake\n  toolchain: main'
            emit core    $'core:\n  config: duckdb/.github/config/core.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit cloud   $'cloud:\n  config: duckdb/.github/config/haybarn/cloud.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit search  $'search:\n  config: duckdb/.github/config/search.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit scanner $'scanner:\n  config: duckdb/.github/config/scanner.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit rust    $'rust:\n  config: duckdb/.github/config/haybarn/rust_based_extensions.cmake\n  default_exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl\n  toolchain: rust'
            echo 'HAYBARN_GROUPS_EOF'
          } >> "$GITHUB_OUTPUT"
          sed -n '/^groups<</,$p' "$GITHUB_OUTPUT"

  build:
    name: Build extensions
    needs: prepare
    # ci-tools haybarn-2.0 (upstream v2.0-cyanoptera + Haybarn): haybarn-ci images/actions, Haybarn-only prebuilt.
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/build.yml@f58e14858320a4897f31eacfb3f15096ee7cb3e7
    with:
      duckdb_version: ${{ needs.prepare.outputs.duckdb_version }}
      duckdb_commit: ${{ needs.prepare.outputs.duckdb_commit }}
      ci_tools_version: f58e14858320a4897f31eacfb3f15096ee7cb3e7
      ci_tools_repository: Query-farm-haybarn/haybarn-extension-ci-tools
      duckdb_repository: Query-farm-haybarn/haybarn
      extension_repository: duckdb/extension-template
      extension_ref: main
      groups: ${{ needs.prepare.outputs.groups }}
      # Release tags (or full_matrix) build every architecture; development builds the reduced set.
      # Reduced mode has no macOS legs (osx_arm64 is not a reduced-CI arch).
      reduced_ci_mode: ${{ (needs.prepare.outputs.tag_build == 'true' || inputs.full_matrix) && 'disabled' || 'enabled' }}
      # Haybarn 2.0 builds no osx_amd64 (opt-in upstream; excluded here too so
      # no group can opt back in) and no wasm_mvp (DuckDB-Wasm 2.0 has no mvp
      # bundle). The matrix adds these to every group's default_exclude_archs.
      exclude_archs: osx_amd64;wasm_mvp
      # No engine archive is produced in this run and none may come from DuckDB; build the engine from source.
      prebuilt_source: disabled
      save_cache: true
      skip_tests: ${{ inputs.skip_tests || false }}
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}

  publish-dry-run:
    name: Publish (dry run)
    needs: build
    uses: ./.github/workflows/haybarn-extensions-publish.yml
    # The called workflow's registry job declares id-token: write; it only runs
    # on a manual deploy dispatch, never from this call.
    permissions:
      contents: read
      actions: read
      id-token: write
    secrets: inherit
    with:
      source_run_id: ${{ github.run_id }}
# Haybarn fork — workflow re-index marker.
