# Haybarn: validates the DuckDB 2.0 extension build path.
#
# This development workflow is BUILD ONLY. It initially builds a small smoke
# set; publication stays disabled until the complete 2.0 extension matrix is
# repinned and validated.
#
# The `build` job uses the DuckDB 2.0 extension-ci-tools build workflow carried
# by Haybarn. It checks out this repository as the engine, then builds the
# extension-template with Haybarn's 2.0 smoke configuration.
name: Haybarn Extensions (2.0)

on:
  push:
    branches:
      - next-2.0
    paths:
      - '.github/config/haybarn_extensions_next_2_0.cmake'
      - '.github/config/haybarn/**'
      - '.github/workflows/haybarn-extensions.yml'
      - 'extension/**'
      - 'src/**'
      - 'tools/shell/**'
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'Haybarn engine ref to build against. Defaults to the workflow commit.'
        type: string
      override_git_describe:
        description: 'DuckDB-compatible version string to embed, e.g. v2.0.0. Empty uses the engine ref.'
        type: string
      skip_tests:
        description: 'Build artifacts without running extension tests.'
        type: boolean
        default: false
      groups:
        description: 'Comma-separated extension groups: smoke, core, cloud, search, scanner, rust, or all.'
        type: string
        default: smoke

concurrency:
  group: haybarn-extensions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  groups:
    name: Select extension groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.select.outputs.groups }}
    steps:
      - id: select
        env:
          REQUESTED: ${{ inputs.groups || 'smoke' }}
        # Upstream Main.yml's groups, with cloud and rust swapped for the Haybarn
        # variants that build the httpfs/iceberg/ducklake/delta build-forks.
        run: |
          set -euo pipefail
          requested=",${REQUESTED// /},"
          [[ "$requested" == ",all," ]] && requested=",core,cloud,search,scanner,rust,"
          emit() { [[ "$requested" == *",$1,"* ]] && printf '%s\n' "$2"; return 0; }
          {
            echo 'groups<<HAYBARN_GROUPS_EOF'
            emit smoke   $'haybarn-2-0:\n  config: duckdb/.github/config/haybarn_extensions_next_2_0.cmake\n  toolchain: main'
            emit core    $'core:\n  config: duckdb/.github/config/core.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit cloud   $'cloud:\n  config: duckdb/.github/config/haybarn/cloud.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit search  $'search:\n  config: duckdb/.github/config/search.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit scanner $'scanner:\n  config: duckdb/.github/config/scanner.cmake\n  extra_toolchains: unixodbc;parser_tools\n  toolchain: main'
            emit rust    $'rust:\n  config: duckdb/.github/config/haybarn/rust_based_extensions.cmake\n  default_exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl\n  toolchain: rust'
            echo 'HAYBARN_GROUPS_EOF'
          } >> "$GITHUB_OUTPUT"
          sed -n '/^groups<</,$p' "$GITHUB_OUTPUT"

  build:
    name: Build extensions
    needs: groups
    # ci-tools haybarn-2.0 (upstream v2.0-cyanoptera + Haybarn): haybarn-ci images/actions, Haybarn-only prebuilt.
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/build.yml@94019a66c8c084806e74fc090fea1f1298dc5997
    with:
      duckdb_version: ${{ inputs.engine_ref || github.sha }}
      override_git_describe: ${{ inputs.override_git_describe }}
      ci_tools_version: 94019a66c8c084806e74fc090fea1f1298dc5997
      ci_tools_repository: Query-farm-haybarn/haybarn-extension-ci-tools
      duckdb_repository: Query-farm-haybarn/haybarn
      extension_repository: duckdb/extension-template
      extension_ref: main
      groups: ${{ needs.groups.outputs.groups }}
      reduced_ci_mode: enabled
      # Haybarn ships osx_amd64, which upstream made opt-in.
      opt_in_archs: osx_amd64
      # No engine archive is produced in this run and none may come from DuckDB; build the engine from source.
      prebuilt_source: disabled
      save_cache: true
      skip_tests: ${{ inputs.skip_tests || false }}
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
# Haybarn fork — workflow re-index marker.
