# Haybarn: builds the full Haybarn extension set, signs each extension with the
# Haybarn extension-signing key, and publishes to the Haybarn extension
# repository on Cloudflare R2 (served at https://haybarn-extensions.query.farm/core).
#
# The `build` job reuses DuckDB's own reusable extension-distribution workflow
# (./.github/workflows/_extension_distribution.yml). That workflow builds with
# `set_caller_as_duckdb: true`, so every extension is built against THIS repo —
# i.e. against the Haybarn build of DuckDB — and handles vcpkg + toolchains.
#
# The `publish` job then signs the built extensions with the Haybarn key and
# uploads them to R2 using the upstream, bucket-parameterized helper scripts
# (scripts/extension-upload-repository.sh -> scripts/extension-upload-single.sh).
name: Haybarn Extensions

on:
  push:
    tags:
      - 'haybarn-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      override_git_describe:
        description: 'Version string to embed (defaults to v1.5.2)'
        type: string
      deploy:
        description: 'Pass "true" to actually upload to R2 (otherwise dry-run)'
        type: string

concurrency:
  group: haybarn-extensions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extensions
    uses: ./.github/workflows/_extension_distribution.yml
    with:
      artifact_prefix: haybarn
      extension_config: .github/config/haybarn_extensions.cmake
      # delta and unity_catalog need a Rust toolchain.
      extra_toolchains: 'rust'
      # Pin the embedded DuckDB version to the upstream release Haybarn is
      # based on, matching the haybarn-release workflow.
      override_duckdb_version: ${{ inputs.override_git_describe || 'v1.5.2' }}
      # Extension tests frequently need external services (postgres, mysql,
      # S3, ...). Build first; enable targeted tests later.
      skip_tests: true
    secrets: inherit

  publish:
    name: Sign and publish to R2
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built extensions
        uses: actions/download-artifact@v4
        with:
          # The reusable build workflow prefixes its artifacts with
          # `artifact_prefix` (haybarn) and each contains a
          # <version>/<platform>/ repository tree.
          pattern: haybarn-*
          path: /tmp/staged
          merge-multiple: true

      - name: Assemble merged repository
        shell: bash
        run: |
          mkdir -p /tmp/haybarn-repository
          # Flatten the per-artifact <version>/<platform>/ trees into one.
          cp -r /tmp/staged/* /tmp/haybarn-repository/ 2>/dev/null || true
          find /tmp/haybarn-repository -name '*.duckdb_extension*' -print
          if [ -z "$(find /tmp/haybarn-repository -name '*.duckdb_extension*' -print -quit)" ]; then
            echo "No built extensions found to publish" >&2
            exit 1
          fi

      - name: Sign and upload to R2 (core repository)
        shell: bash
        env:
          # Private key whose public half is embedded in
          # src/main/extension/extension_helper.cpp.
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.HAYBARN_EXTENSION_SIGNING_PK }}
          AWS_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # for_real => actually upload; anything else => dry run.
          DUCKDB_DEPLOY_SCRIPT_MODE: ${{ inputs.deploy == 'true' && 'for_real' || 'dry_run' }}
        run: |
          python3 -m pip install awscli
          # $2 is the target bucket+prefix; the R2 bucket is fronted by
          # haybarn-extensions.query.farm with a top-level core/ prefix.
          ./scripts/extension-upload-repository.sh \
            "/tmp/haybarn-repository/*" "${{ secrets.R2_BUCKET }}/core"
