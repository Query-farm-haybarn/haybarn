# Haybarn: validates the DuckDB 2.0 extension build path.
#
# This development workflow is BUILD ONLY. It initially builds a small smoke
# set; publication stays disabled until the complete 2.0 extension matrix is
# repinned and validated.
#
# The `build` job uses the DuckDB 2.0 extension-ci-tools build workflow carried
# by Haybarn. It checks out this repository as the engine, then builds the
# extension-template with Haybarn's 2.0 smoke configuration.
name: Haybarn Extensions (2.0)

on:
  push:
    branches:
      - next-2.0
    paths:
      - '.github/config/haybarn_extensions_next_2_0.cmake'
      - '.github/workflows/haybarn-extensions.yml'
      - 'extension/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      engine_ref:
        description: 'Haybarn engine ref to build against. Defaults to the workflow commit.'
        type: string
      override_git_describe:
        description: 'DuckDB-compatible version string to embed, e.g. v2.0.0. Empty uses the engine ref.'
        type: string
      skip_tests:
        description: 'Build artifacts without running extension tests.'
        type: boolean
        default: false

concurrency:
  group: haybarn-extensions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extensions
    # next-2.0 includes Haybarn's shared library in native test-support bundles.
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/build.yml@next-2.0
    with:
      duckdb_version: ${{ inputs.engine_ref || github.sha }}
      override_git_describe: ${{ inputs.override_git_describe }}
      ci_tools_version: next-2.0
      ci_tools_repository: Query-farm-haybarn/haybarn-extension-ci-tools
      duckdb_repository: Query-farm-haybarn/haybarn
      extension_repository: duckdb/extension-template
      extension_ref: main
      groups: |
        haybarn-2-0:
          config: duckdb/.github/config/haybarn_extensions_next_2_0.cmake
          toolchain: main
      reduced_ci_mode: enabled
      save_cache: true
      skip_tests: ${{ inputs.skip_tests || false }}
    secrets:
      vcpkg_token: ${{ secrets.HAYBARN_VCPKG_TOKEN }}
# Haybarn fork — workflow re-index marker.
