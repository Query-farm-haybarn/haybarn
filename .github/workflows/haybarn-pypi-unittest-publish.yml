# Haybarn: publish the release unittest binaries to PyPI as haybarn-unittest
# wheels. Sibling of haybarn-pypi-cli-publish.yml (the CLI); same mechanism,
# different binary + package.
#
# One package, multiple platform-tagged wheels:
#
#   haybarn_unittest-1.5.4rc7-py3-none-manylinux_2_28_x86_64.whl
#   haybarn_unittest-1.5.4rc7-py3-none-manylinux_2_28_aarch64.whl
#   haybarn_unittest-1.5.4rc7-py3-none-musllinux_1_2_x86_64.whl
#   haybarn_unittest-1.5.4rc7-py3-none-musllinux_1_2_aarch64.whl
#   haybarn_unittest-1.5.4rc7-py3-none-macosx_11_0_x86_64.whl
#   haybarn_unittest-1.5.4rc7-py3-none-macosx_11_0_arm64.whl
#   haybarn_unittest-1.5.4rc7-py3-none-win_amd64.whl
#
# pip / uv select the right wheel from the platform tag in the filename.
#
# Auth: PyPI Trusted Publishers via OIDC (no API token). Provenance:
# pypa/gh-action-pypi-publish enables PEP 740 attestations by default
# when OIDC is in use.
name: Haybarn PyPI unittest publish

on:
  workflow_run:
    workflows: ["Haybarn Publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. haybarn-v1.5.4-rc7)'
        type: string
        required: true

permissions:
  contents: read       # gh release download
  id-token: write      # PyPI Trusted Publisher OIDC

concurrency:
  group: haybarn-pypi-unittest-publish-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v6

      # Chained workflow_run events on GitHub Actions don't reliably
      # propagate the originating tag name into head_branch — Haybarn
      # Publish (workflow_run on Haybarn Release) sees head_branch='haybarn'
      # (the branch the workflow file lives on) instead of the tag that
      # triggered the original Haybarn Release. The commit SHA is propagated
      # correctly though, so we re-derive the tag via a refs/tags lookup
      # when TAG doesn't already look like one.
      - name: Re-derive TAG from head_sha if needed
        if: ${{ github.event_name == 'workflow_run' && !startsWith(env.TAG, 'haybarn-v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          # Walk haybarn-v* tag refs, dereferencing annotated tags. For an
          # annotated tag (`object.type == "tag"`), the ref's `object.sha`
          # is the tag-object SHA — NOT the commit. We must follow the tag
          # object to its `.object.sha` to find the commit. Skipping this
          # was rc10's specific failure mode (annotated tag, no match).
          LOOKUP=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/haybarn-v" \
                     --jq '.[] | "\(.ref) \(.object.type) \(.object.sha)"' \
                   | while read ref kind obj_sha; do
                       commit_sha="$obj_sha"
                       if [[ "$kind" == "tag" ]]; then
                         commit_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq .object.sha)
                       fi
                       if [[ "$commit_sha" == "$SHA" ]]; then
                         echo "$ref"
                       fi
                     done \
                   | sed 's|refs/tags/||' \
                   | head -1)
          if [[ -z "$LOOKUP" ]]; then
            echo "::error::head_sha $SHA doesn't correspond to a haybarn-v* tag — nothing to publish"
            exit 1
          fi
          echo "::notice::Re-derived TAG via head_sha lookup: $LOOKUP"
          echo "TAG=$LOOKUP" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Derive PyPI version from the release tag
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Tag format: haybarn-v<MAJOR>.<MINOR>.<PATCH>[-rc<N>]
          # Strip 'haybarn-v' and rewrite '-rc<N>' → 'rc<N>' for PEP 440.
          NPM_VERSION="${TAG#haybarn-v}"
          PYPI_VERSION="$(echo "$NPM_VERSION" | sed -E 's/-(rc[0-9]+)$/\1/')"
          echo "tag_version=${NPM_VERSION}"  >> "$GITHUB_OUTPUT"
          echo "pep440=${PYPI_VERSION}"      >> "$GITHUB_OUTPUT"
          echo "Resolved PyPI version: ${PYPI_VERSION} (from tag ${TAG})"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'haybarn_unittest-*.zip'
          ls -la release-assets/

      - name: Build per-platform wheels
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION='${{ steps.ver.outputs.tag_version }}'
          mkdir -p dist

          # ZIP_BASENAME → PyPI platform tag (PEP 425 / 600 / 656). Same tag
          # mapping as the CLI wheels; see haybarn-pypi-cli-publish.yml for the
          # rationale behind each floor (manylinux_2_28 / musllinux_1_2 /
          # macosx_11_0).
          declare -A PLAT=(
            [haybarn_unittest-linux-amd64.zip]=manylinux_2_28_x86_64
            [haybarn_unittest-linux-arm64.zip]=manylinux_2_28_aarch64
            [haybarn_unittest-linux-amd64-musl.zip]=musllinux_1_2_x86_64
            [haybarn_unittest-linux-arm64-musl.zip]=musllinux_1_2_aarch64
            [haybarn_unittest-osx-amd64.zip]=macosx_11_0_x86_64
            [haybarn_unittest-osx-arm64.zip]=macosx_11_0_arm64
            [haybarn_unittest-windows-amd64.zip]=win_amd64
          )

          for zip in "${!PLAT[@]}"; do
            src="release-assets/$zip"
            if [[ ! -f "$src" ]]; then
              echo "::warning::missing release asset $zip — skipping its wheel"
              continue
            fi
            python3 tools/pypi-cli/build_wheel.py \
              --src-zip "$src" \
              --platform-tag "${PLAT[$zip]}" \
              --version "$TAG_VERSION" \
              --project haybarn-unittest \
              --dist haybarn_unittest \
              --entry-module haybarn_unittest \
              --binary-name haybarn-unittest \
              --script-name haybarn-unittest \
              --summary "Haybarn unittest — the DuckDB unittest test runner for the Haybarn engine, runnable via uvx haybarn-unittest." \
              --shim tools/pypi-unittest/haybarn_unittest/__init__.py \
              --readme tools/pypi-unittest/README.md \
              --license LICENSE \
              --out-dir dist/
          done

          echo "=== built wheels ==="
          ls -la dist/

      - name: Publish to PyPI via Trusted Publisher
        # OIDC token-exchange handled by the action; no PYPI_API_TOKEN
        # secret needed. Action also attaches PEP 740 attestations.
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          attestations: true
          # If a wheel for this version+platform has somehow already
          # been published (e.g. workflow re-run), skip rather than fail.
          skip-existing: true
          verbose: true

      - name: Verify
        shell: bash
        run: |
          PEP="${{ steps.ver.outputs.pep440 }}"
          echo "haybarn-unittest ${PEP} published to PyPI."
          echo "Users can run:"
          echo "  uvx haybarn-unittest==${PEP} --test-dir . --list-tests"
          echo "or for the latest stable:"
          echo "  uvx haybarn-unittest --test-dir . --list-tests"
# Haybarn fork — workflow re-index marker.
