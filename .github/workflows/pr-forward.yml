name: Forward PR events to pr-tracker

# Thin caller. All forwarding logic lives in the shared composite action
# (duckdb/duckdb-ci/pr-tracker/forward), so changes there reach every tracked repo
# with no per-repo edit. Only the triggers below and the token are per-repo — keep
# the trigger list a generous superset so this file rarely needs to change.

on:
  # Haybarn: upstream auto-triggers removed so this workflow
  # does not run on the fork (it forwards to DuckDB's own trackers or
  # acts on PRs with base-repository privileges). Still runnable manually.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forward:
    # Skip events pr-tracker ignores *before* a runner is assigned, so they never
    # take a slot from CI: comments on issues, CI runs from branch pushes, draft
    # conversions, and labels that don't move a card (contains() ignores case,
    # so `Ready For Review` / `changes requested` spellings all match).
    if: >-
      ${{ (github.event_name != 'issue_comment' || github.event.issue.pull_request != null)
          && (github.event_name != 'workflow_run'
              || contains(fromJSON('["pull_request","pull_request_target"]'), github.event.workflow_run.event))
          && github.event.action != 'converted_to_draft'
          && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action)
              || contains(fromJSON('["changes requested","do not review","ready for review"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: duckdb/duckdb-ci/pr-tracker/forward@main
        with:
          token: ${{ secrets.PR_DISPATCH_TOKEN }}
