# Haybarn: builds and publishes the `haybarn` Python package. The package and
# import name are `haybarn`; the compiled module is renamed out of `duckdb` so a
# Haybarn wheel and a real `duckdb` wheel can coexist. See tools/pythonpkg.
name: Haybarn Python

on:
  push:
    tags:
      - 'haybarn-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      override_git_describe:
        description: 'Version string to embed (defaults to v1.5.2)'
        type: string
      publish:
        description: 'Where to publish: "pypi", "testpypi", or empty for none'
        type: string

concurrency:
  group: haybarn-python-${{ github.ref }}
  cancel-in-progress: true

env:
  OVERRIDE_GIT_DESCRIBE: ${{ inputs.override_git_describe || 'v1.5.2' }}

jobs:
  wheels:
    name: Wheels ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        with:
          package-dir: tools/pythonpkg
        env:
          # Skip the slowest / least-used targets for now; widen later.
          CIBW_SKIP: 'pp* *-musllinux* cp38-*'
          CIBW_ARCHS_MACOS: universal2
          OVERRIDE_GIT_DESCRIBE: ${{ env.OVERRIDE_GIT_DESCRIBE }}

      - uses: actions/upload-artifact@v4
        with:
          name: haybarn-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist
        run: |
          python -m pip install build
          python -m build --sdist --outdir dist tools/pythonpkg
      - uses: actions/upload-artifact@v4
        with:
          name: haybarn-sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [wheels, sdist]
    if: ${{ inputs.publish == 'pypi' || inputs.publish == 'testpypi' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: haybarn-*
          path: dist
          merge-multiple: true
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          repository-url: ${{ inputs.publish == 'testpypi' && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
          password: ${{ secrets.PYPI_API_TOKEN }}
