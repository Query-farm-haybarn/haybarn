# Haybarn 2.0: signs the extensions produced by `Haybarn Extensions (2.0)`
# (haybarn-extensions.yml) with the Haybarn extension-signing key and publishes
# them to the Haybarn extension repository on Cloudflare R2 (served at
# https://haybarn-extensions.query.farm/core), plus PyPI + npm.
#
# Decoupled from the build on purpose: a flaky publish can be retried without
# re-running the build — dispatch with a source_run_id pointing at a prior
# build run consumes that run's artifacts directly.
#
# Triggers
#   workflow_call      every build run calls this as a DRY RUN against its own
#                      artifacts, so the publish path is validated continuously.
#   workflow_dispatch  explicit operator action (`--ref next-2.0`): name the
#                      build run to publish (source_run_id) and pass
#                      deploy=true to actually push. Only builds of a
#                      haybarn-v2.* tag can be deployed.
#
# The 1.5 line publishes from the `haybarn` branch's copy of this file, which is
# what GitHub runs for workflow_run triggers; this copy has none.
name: Haybarn Extensions Publish

on:
  workflow_call:
    inputs:
      source_run_id:
        description: 'Build run whose artifacts to dry-run publish'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source_run_id:
        description: '`Haybarn Extensions (2.0)` run ID whose artifacts to publish'
        type: string
        required: true
      deploy:
        description: 'Pass "true" to actually upload to R2 / PyPI / npm (otherwise dry-run)'
        type: string
        default: 'false'

permissions:
  contents: read
  actions: read       # download-artifact across workflow runs

# Don't cancel an in-flight publish — finishing what we started is safer
# than racing two writers against the same R2 prefix.
concurrency:
  group: haybarn-extensions-publish-${{ inputs.source_run_id }}
  cancel-in-progress: false

env:
  # ci-tools haybarn-2.0: publish_extensions.py and _extension_registry_publish.yml.
  # Keep in sync with the build.yml pin in haybarn-extensions.yml.
  HAYBARN_CI_TOOLS_REF: 94019a66c8c084806e74fc090fea1f1298dc5997

jobs:
  publish:
    name: Sign and publish to R2
    runs-on: ubuntu-24.04
    outputs:
      deploy: ${{ steps.context.outputs.deploy }}
      duckdb_version: ${{ steps.context.outputs.duckdb_version }}
    steps:
      - name: Resolve source run, versions and deploy mode
        id: context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          # workflow_call never deploys, whatever the caller passes.
          REQUESTED_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          run_json=$(gh api "repos/${{ github.repository }}/actions/runs/$SOURCE_RUN_ID")
          HEAD_SHA=$(jq -r .head_sha <<<"$run_json")
          SOURCE_REF=$(jq -r .head_branch <<<"$run_json")
          SOURCE_EVENT=$(jq -r .event <<<"$run_json")
          # A haybarn-vX.Y.Z[-rcN] tag build embeds DuckDB version vX.Y.Z; the
          # Haybarn version keeps the rc suffix (npm/PyPI version suffix).
          if [[ "$SOURCE_EVENT" == push && "$SOURCE_REF" =~ ^haybarn-v(2\.[0-9]+\.[0-9]+)(-rc[0-9]+)?$ ]]; then
            DUCKDB_VERSION="v${BASH_REMATCH[1]}"
            HAYBARN_VERSION="${SOURCE_REF#haybarn-v}"
            TAG_BUILD=true
          elif [[ "$SOURCE_REF" == next-2.0 ]]; then
            # Development builds: the release line the branch is on (X.Y.0).
            release=$(gh api "repos/${{ github.repository }}/contents/scripts/ci/release_version.txt?ref=$HEAD_SHA" --jq .content | base64 -d | tr -d '[:space:]')
            DUCKDB_VERSION="v${release}.0"
            HAYBARN_VERSION="${DUCKDB_VERSION#v}"
            TAG_BUILD=false
          else
            echo "::error::run $SOURCE_RUN_ID was built from '$SOURCE_REF' ($SOURCE_EVENT); this workflow publishes only the 2.0 line (next-2.0 or haybarn-v2.* tags)"
            exit 1
          fi
          DEPLOY=false
          if [[ "$REQUESTED_DEPLOY" == true ]]; then
            if [[ "$TAG_BUILD" != true ]]; then
              echo "::error::deploy=true needs a haybarn-v2.* tag build; run $SOURCE_RUN_ID is a development build of $SOURCE_REF"
              exit 1
            fi
            DEPLOY=true
          fi
          {
            echo "head_sha=$HEAD_SHA"
            echo "duckdb_version=$DUCKDB_VERSION"
            echo "haybarn_version=$HAYBARN_VERSION"
            echo "tag_build=$TAG_BUILD"
            echo "deploy=$DEPLOY"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::publishing run $SOURCE_RUN_ID ($SOURCE_REF @ $HEAD_SHA) as $DUCKDB_VERSION / haybarn $HAYBARN_VERSION (deploy=$DEPLOY)"

      # The build's commit supplies the engine commit/ts, LICENSE and the
      # extension configs for the allowlist below.
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.context.outputs.head_sha }}
          fetch-depth: 1

      - name: Download built extensions
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # build.yml names them <group>-extensions-<arch>; each holds a
          # <version>/<platform>/ repository tree.
          pattern: '*-extensions-*'
          path: /tmp/staged
          merge-multiple: true

      - name: Assemble repository (Haybarn extensions only)
        shell: bash
        env:
          DUCKDB_VERSION: ${{ steps.context.outputs.duckdb_version }}
          TAG_BUILD: ${{ steps.context.outputs.tag_build }}
        run: |
          set -euo pipefail
          # test-support/ holds the build's test bundles (unittest + libs), not extensions.
          roots=()
          for d in /tmp/staged/*/; do
            [ "$(basename "$d")" = test-support ] || roots+=("$(basename "$d")")
          done
          if [ "${#roots[@]}" -ne 1 ]; then
            echo "::error::expected one <version>/ root in the artifacts, found: ${roots[*]}"
            exit 1
          fi
          root="${roots[0]}"
          if [ "$root" != "$DUCKDB_VERSION" ]; then
            if [ "$TAG_BUILD" = true ]; then
              echo "::error::tag build produced extensions for '$root', expected $DUCKDB_VERSION"
              exit 1
            fi
            # Development builds embed vX.Y.Z-devN, which the engine files under
            # the commit hash; re-root so the dry run exercises the release layout.
            echo "::notice::dry run: development tree '$root' staged as $DUCKDB_VERSION"
          fi
          mkdir -p "/tmp/haybarn-repository/$DUCKDB_VERSION"
          cp -r "/tmp/staged/$root/." "/tmp/haybarn-repository/$DUCKDB_VERSION/"

          # Publish exactly the extensions Haybarn's group configs declare: the
          # build also emits the extension-template's own `waddle` and test
          # extensions (demo_capi, ...), which must never reach the repository.
          # In-tree set = upstream core.cmake + cloud.cmake IN_TREE blocks.
          allow=$(python3 -I - <<'EOF'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import sync_out_of_tree_extensions as s
          base = Path(".github/config/extensions").resolve()
          names = {"autocomplete", "core_functions", "icu", "json", "parquet", "tpcds", "tpch"}
          for config in ("core.cmake", "haybarn/cloud.cmake", "search.cmake", "scanner.cmake",
                         "haybarn/rust_based_extensions.cmake"):
              names.update(e["name"] for e in s.parse_cmake_file(Path(".github/config") / config, base))
          print("\n".join(sorted(names)))
          EOF
          )
          echo "allowlist: $(tr '\n' ' ' <<<"$allow")"
          while IFS= read -r f; do
            name=$(basename "$f"); name=${name%%.duckdb_extension*}
            if ! grep -qx "$name" <<<"$allow"; then
              echo "::notice::not publishing $name (${f#/tmp/haybarn-repository/})"
              rm -f "$f"
            fi
          done < <(find /tmp/haybarn-repository -name '*.duckdb_extension*' -type f)
          find /tmp/haybarn-repository -name '*.duckdb_extension*' -type f | sort
          if [ -z "$(find /tmp/haybarn-repository -name '*.duckdb_extension*' -print -quit)" ]; then
            echo "::error::no Haybarn extensions found to publish"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          repository: 'Query-farm-haybarn/haybarn-extension-ci-tools'
          ref: ${{ env.HAYBARN_CI_TOOLS_REF }}
          path: ci-tools

      - name: Capture engine commit + timestamp (for CalVer + manifest)
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=$(git log -1 --format=%H)"
            echo "commit_ts=$(git log -1 --format=%ct)"
          } >> "$GITHUB_OUTPUT"

      - name: Sign + upload to R2 (latest + per-commit) and stage pip/npm artifacts
        shell: bash
        env:
          # Private key whose public half is embedded in
          # src/main/extension/extension_helper.cpp.
          DUCKDB_EXTENSION_SIGNING_PK: ${{ secrets.HAYBARN_EXTENSION_SIGNING_PK }}
          HAYBARN_GPG_PRIVATE_KEY:     ${{ secrets.HAYBARN_GPG_PRIVATE_KEY }}
          HAYBARN_GPG_PASSPHRASE:      ${{ secrets.HAYBARN_GPG_PASSPHRASE }}
          AWS_ENDPOINT_URL:            ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID:           ${{ secrets.R2_ACCESS_KEY_ID }}
          # The org secret is named R2_SECRET_KEY_ID; it holds the secret half.
          AWS_SECRET_ACCESS_KEY:       ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_DEFAULT_REGION:          auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          python3 -m pip install awscli cryptography tqdm
          which brotli || {
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends brotli
          }
          python3 ci-tools/scripts/publish/publish_extensions.py \
            --repo-dir          /tmp/haybarn-repository \
            --engine-commit     '${{ steps.engine.outputs.commit }}' \
            --engine-commit-ts  '${{ steps.engine.outputs.commit_ts }}' \
            --haybarn-version   '${{ steps.context.outputs.haybarn_version }}' \
            --duckdb-version    '${{ steps.context.outputs.duckdb_version }}' \
            --r2-bucket         '${{ secrets.R2_BUCKET }}' \
            --r2-prefix         core \
            --license           LICENSE \
            --dist-dir          dist/ \
            --signed-by         haybarn-extension-signing-2026 \
            --channels          'r2-core,pypi,npm' \
            --write-latest \
            --deploy            '${{ steps.context.outputs.deploy }}'

      - name: Upload pip wheels as artifact
        if: ${{ steps.context.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-pypi-wheels
          path: dist/pypi/
          if-no-files-found: error
          retention-days: 2

      - name: Upload npm leaves + metas as artifact
        if: ${{ steps.context.outputs.deploy == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: core-npm-packages
          path: |
            dist/npm-leaves/
            dist/npm-metas/
          if-no-files-found: error
          retention-days: 2

  # Registry publish (PyPI + npm) is the consolidated reusable workflow in
  # ci-tools; artifact_shape=bundled downloads the core-pypi-wheels +
  # core-npm-packages artifacts the publish job uploaded to this run.
  call_publish_registries:
    name: Publish PyPI + npm
    needs: publish
    if: ${{ needs.publish.outputs.deploy == 'true' }}
    uses: Query-farm-haybarn/haybarn-extension-ci-tools/.github/workflows/_extension_registry_publish.yml@94019a66c8c084806e74fc090fea1f1298dc5997
    permissions:
      contents: read
      actions:  read
      id-token: write
    secrets: inherit
    with:
      artifact_shape: bundled
      # MUST match the ref in the `uses:` line above.
      ci_tools_ref: 94019a66c8c084806e74fc090fea1f1298dc5997
      duckdb_version: ${{ needs.publish.outputs.duckdb_version }}
      source_run_id: ''
