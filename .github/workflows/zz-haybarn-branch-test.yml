# Scratch: builds this branch in the haybarn-ci image and runs the extension
# repository tests. Not for merging; drop this commit before next-2.0.
name: Branch test (extension repositories)
on:
  push:
    branches:
      - feat/haybarn-extension-repo

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build (haybarn-ci image)
        shell: bash
        env:
          IMAGE: ghcr.io/query-farm-haybarn/haybarn-ci/manylinux_2_28_amd64_main:20261021-824906a5
          CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
        run: |
          export WORKSPACE="$(pwd)"
          docker pull "$IMAGE"
          docker run \
            -v"$WORKSPACE":"$WORKSPACE" \
            -w "$WORKSPACE" \
            -e CI=true -e GITHUB_ACTIONS=true \
            -e GEN=ninja \
            -e CCACHE_DIR="$WORKSPACE/.ccache" \
            -e CCACHE_BASEDIR="$WORKSPACE" -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_REMOTE_STORAGE \
            -e OVERRIDE_GIT_DESCRIBE=v2.0.0 \
            -e EXTENSION_CONFIGS="$WORKSPACE/.github/config/bundled_extensions.cmake" \
            -e DUCKDB_CAPABILITIES='httplib loadable_extensions' \
            -e WORKSPACE="$WORKSPACE" \
            "$IMAGE" \
            bash -c 'set -e; \
                     git config --global --add safe.directory "$WORKSPACE"; \
                     make -C "$WORKSPACE"; \
                     ccache -s || true'

      - name: Extension repository tests
        run: |
          ./build/release/test/unittest "test/sql/extensions/extension_repositor*"
          ./build/release/test/unittest "*repositor*"
          ./build/release/test/unittest "*signing keys a load trusts*"
          ./build/release/test/unittest "*Haybarn trust root*"

      - name: query.farm repository, end to end
        run: |
          home=$(mktemp -d)
          if curl -fsS https://duckdb-extensions.query.farm/.well-known/haybarn-extension-repo.json; then
            echo "query.farm publishes the Haybarn file: installing a5 from it"
            HOME=$home ./build/release/haybarn -c "
              SET allow_extension_repositories = 'allowed';
              CREATE EXTENSION REPOSITORY IF NOT EXISTS query_farm
                WITH PREFIX 'https://duckdb-extensions.query.farm';
              INSTALL a5 FROM query_farm; LOAD a5 FROM query_farm;
              SELECT extension_name, loaded, installed_from, install_path FROM duckdb_extensions() WHERE extension_name = 'a5';"
          else
            HOME=$home ./build/release/haybarn -c "
              SET allow_extension_repositories = 'allowed';
              CREATE EXTENSION REPOSITORY IF NOT EXISTS query_farm
                WITH PREFIX 'https://duckdb-extensions.query.farm';
            " && exit 1 || echo "rejected as expected: query.farm does not publish the Haybarn file yet"
          fi
          test ! -e "$home/.duckdb/extension_repositories"

      - name: Stand-in for query.farm (local prefix redirecting to haybarn-extensions)
        run: |
          set -x
          srv=$(mktemp -d)
          mkdir -p "$srv/.well-known"
          cp .github/zz-test/haybarn-extension-repo.json "$srv/.well-known/"
          (cd "$srv" && python3 -m http.server 8765 --bind 127.0.0.1 > /dev/null 2>&1 &)
          sleep 2
          home=$(mktemp -d)
          HOME=$home ./build/release/haybarn -c "
            SET allow_extension_repositories = 'allowed';
            CREATE EXTENSION REPOSITORY IF NOT EXISTS query_farm WITH PREFIX 'http://127.0.0.1:8765';
            INSTALL a5 FROM query_farm;
            LOAD a5 FROM query_farm;
            SELECT extension_name, loaded, installed_from, install_path FROM duckdb_extensions() WHERE extension_name = 'a5';
            SELECT function_name FROM duckdb_functions() WHERE function_name LIKE 'a5%' ORDER BY 1 LIMIT 3;"
          cat "$home"/.haybarn/extension_repositories/*.json
          test ! -e "$home/.duckdb/extension_repositories"

      - name: Mainline build with the Haybarn key is refused
        run: |
          home=$(mktemp -d)
          key=$(python3 -c 'import json; print(json.load(open(".github/zz-test/haybarn-extension-repo.json"))["signature_keys"][0])')
          HOME=$home ./build/release/haybarn -c "
            SET allow_extension_repositories = 'allowed';
            CREATE EXTENSION REPOSITORY mainline WITH PREFIX 'https://duckdb-extensions.query.farm' USING PUBLIC KEY '$key';
            INSTALL a5 FROM mainline;
          " && { echo "mainline build installed: FAIL"; exit 1; } || echo "refused as expected"
