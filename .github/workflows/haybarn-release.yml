# Haybarn: builds the `haybarn` CLI and `libhaybarn` libraries for all release
# platforms. Self-contained (does not reuse DuckDB's S3-staging-coupled release
# workflows). Artifacts are uploaded for the haybarn-publish workflow to sign
# and attach to a GitHub Release.
#
# DuckDB 2.0: mirrors upstream's release jobs (Main.yml linux-release /
# linux-release-musl, OSX.yml, Windows.yml) — bundled_extensions.cmake,
# DUCKDB_CAPABILITIES without the local extension repository, the CLI CPU
# baseline, ThinLTO for glibc Linux, clang-cl on Windows, and
# `make static-libs-release-artifact`. The static-libs archives are also staged
# to Haybarn's R2 tree so extension builds link the Haybarn engine instead of
# compiling it (and never DuckDB's own archives).
name: Haybarn Release

on:
  push:
    tags:
      - 'haybarn-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      override_git_describe:
        description: 'Version string to embed (defaults to the upstream tag, e.g. v2.0.0)'
        type: string
      skip_tests:
        description: 'Pass "true" to skip tests'
        type: string
      stage_prebuilt:
        description: 'Upload the static-libs archives to Haybarn staging (always on for tag pushes)'
        type: boolean
        default: false

concurrency:
  group: haybarn-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write       # OIDC for build-provenance attestation signing
  attestations: write   # write to the GitHub attestations API
  contents: read

env:
  # Haybarn is built from a specific upstream DuckDB tag. The version string the
  # binary reports stays the upstream version (e.g. v2.0.0) for storage and
  # extension-path compatibility; see the plan's branding decisions.
  OVERRIDE_GIT_DESCRIBE: ${{ inputs.override_git_describe || 'v2.0.0' }}
  # Haybarn-specific version string that drives the startup banner + `-version`
  # flag (distinct from the upstream OVERRIDE_GIT_DESCRIBE above which dictates
  # storage compat). On tag push (`refs/tags/haybarn-v...`) GITHUB_REF_NAME is
  # the tag itself ("haybarn-v2.0.0-rc1"); on workflow_dispatch it's empty, and
  # CMake will derive it from `git describe --match 'haybarn-v*'` instead.
  HAYBARN_GIT_DESCRIBE: ${{ startsWith(github.ref, 'refs/tags/haybarn-v') && github.ref_name || '' }}
  # haybarn-ci build images (fork of duckdb/duckdb-ci, published by its
  # haybarn-images.yml; alias v2.0.0).
  HAYBARN_CI_IMAGE_VERSION: 20261021-824906a5
  # Engine static libraries, in the order upstream packages them. Paths are
  # relative to the build directory.
  STATIC_LIBRARIES_UNIX: src/libhaybarn_static.a src/libduckdb_shell.a src/main/http/libduckdb_httplib.a src/main/extension/libduckdb_loadable_extensions.a

jobs:
  linux:
    name: Linux ${{ matrix.config.arch }}${{ matrix.config.libc == 'musl' && '-musl' || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          # glibc legs are upstream's "optimized" canonical builds (ThinLTO, native
          # static archives); musl legs are its non-LTO builds.
          - { runner: ubuntu-24.04,     arch: amd64, image: manylinux_2_28_amd64_main,  libc: glibc, march: x86-64-v3 }
          - { runner: ubuntu-24.04-arm,  arch: arm64, image: manylinux_2_28_aarch64_main, libc: glibc, march: armv8-a }
          - { runner: ubuntu-24.04,     arch: amd64, image: alpine_3_22_amd64_main,     libc: musl,  march: x86-64-v3 }
          - { runner: ubuntu-24.04-arm,  arch: arm64, image: alpine_3_22_aarch64_main,   libc: musl,  march: armv8-a }
    runs-on: ${{ matrix.config.runner }}
    env:
      SUFFIX: ${{ matrix.config.arch }}${{ matrix.config.libc == 'musl' && '-musl' || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Persist the ccache directory across runs. The docker builds set
      # CCACHE_DIR=$PWD/.ccache and bind-mount $PWD, so .ccache in the workspace
      # is the cache. Without this every release build is a cold full recompile.
      # (The ThinLTO glibc legs bypass ccache, as upstream does.)
      - name: ccache
        if: matrix.config.libc == 'musl'
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-release-linux-${{ matrix.config.arch }}-${{ matrix.config.libc }}-${{ github.sha }}
          restore-keys: |
            ccache-release-linux-${{ matrix.config.arch }}-${{ matrix.config.libc }}-

      - name: Build (haybarn-ci image)
        shell: bash
        env:
          IMAGE: ghcr.io/query-farm-haybarn/haybarn-ci/${{ matrix.config.image }}:${{ env.HAYBARN_CI_IMAGE_VERSION }}
          CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
          # The unittest binary ships as haybarn-unittest, so it must launch from
          # any cwd (consumers pass --test-dir).
          BUILD_CMAKE_VARIABLES: >-
            -DUNITTEST_ROOT_DIRECTORY=.
            ${{ matrix.config.libc == 'glibc' && '-DCMAKE_C_COMPILER_LAUNCHER= -DCMAKE_CXX_COMPILER_LAUNCHER= -DNATIVE_LTO_STATIC_LIBRARIES=1' || '' }}
          LTO: ${{ matrix.config.libc == 'glibc' && 'thin' || '' }}
          LTO_JOBS: ${{ matrix.config.libc == 'glibc' && '8' || '' }}
        run: |
          export WORKSPACE="$(pwd)"
          docker pull "$IMAGE"
          # `-w "$WORKSPACE"` sets the container's working directory to the
          # bind-mounted host path; the images' own WORKDIR would otherwise miss
          # the Makefile. The images default to clang (CC/CXX).
          # CI=true as in a job container: DuckDB's CMake only picks the mold
          # linker (as upstream's release builds use) when CI is set; GNU ld
          # rejects the native-LTO engine archive next to libduckdb_zstd.a.
          docker run \
            -v"$WORKSPACE":"$WORKSPACE" \
            -w "$WORKSPACE" \
            -e CI=true -e GITHUB_ACTIONS=true \
            -e GEN=ninja \
            -e CCACHE_DIR="$WORKSPACE/.ccache" \
            -e CCACHE_BASEDIR="$WORKSPACE" -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_REMOTE_STORAGE \
            -e OVERRIDE_GIT_DESCRIBE="$OVERRIDE_GIT_DESCRIBE" \
            -e HAYBARN_GIT_DESCRIBE \
            -e EXTRA_CMAKE_VARIABLES="$BUILD_CMAKE_VARIABLES" \
            -e LTO -e LTO_JOBS \
            -e EXTENSION_CONFIGS="$WORKSPACE/.github/config/bundled_extensions.cmake" \
            -e DUCKDB_CAPABILITIES='httplib loadable_extensions' \
            -e WORKSPACE="$WORKSPACE" \
            "$IMAGE" \
            bash -c 'set -e; \
                     $CC --version | head -1; \
                     git config --global --add safe.directory "$WORKSPACE"; \
                     make -C "$WORKSPACE"; \
                     ccache -s || true'

      - name: Verify architecture flags
        shell: bash
        run: |
          grep -Fq -- '-march=${{ matrix.config.march }}' build/release/compile_commands.json
          grep -Fq -- '-mtune=generic' build/release/compile_commands.json
          grep -Fq -- '-fuse-ld=mold' build/release/build.ninja
          if [[ "${{ matrix.config.libc }}" == "glibc" ]]; then
            grep -Fq -- '-flto=thin' build/release/compile_commands.json
          elif grep -Fq -- '-flto' build/release/compile_commands.json; then
            echo "musl build unexpectedly contains LTO flags" >&2
            exit 1
          fi

      # musl binaries are built inside Alpine and won't run on the glibc host
      # runner, so steps that *execute* the binary are glibc-only. The musl
      # binary is still built and packaged below. (TODO: run musl smoke
      # tests inside the alpine container.)
      - name: Print platform
        if: matrix.config.libc != 'musl'
        run: ./build/release/haybarn -c "PRAGMA platform; PRAGMA version;"

      # Release builds run a fast smoke test only: the `release`-tagged unittest
      # subset plus the shell tests and a basic query. The full unit-test suite
      # (~2h/platform) belongs in a separate test workflow, not the release path.
      - name: Smoke test
        if: ${{ inputs.skip_tests != 'true' && matrix.config.libc != 'musl' }}
        shell: bash
        run: |
          python3 -m pip install pytest
          ./build/release/test/unittest --select-tag release
          python3 -m pytest tools/shell/tests --shell-binary build/release/haybarn
          ./build/release/haybarn -c "SELECT 42 AS answer; PRAGMA version;"

      - name: Package
        shell: bash
        run: |
          zip -j haybarn_cli-linux-$SUFFIX.zip build/release/haybarn
          gzip -9 -k -n -c build/release/haybarn > haybarn_cli-linux-$SUFFIX.gz
          zip -j libhaybarn-linux-$SUFFIX.zip build/release/src/libhaybarn*.so* \
            src/include/duckdb.h src/include/duckdb_v2.h
          # unittest binary, shipped as haybarn-unittest via npm/PyPI. Built
          # with -DUNITTEST_ROOT_DIRECTORY=. (above) so it launches anywhere;
          # consumers pass --test-dir <their tests>. .zip only — no .gz parity
          # (npm/PyPI consume the zip; the GH-release zip covers manual download).
          cp build/release/test/unittest haybarn-unittest
          zip -j haybarn_unittest-linux-$SUFFIX.zip haybarn-unittest
          # Engine static libraries + C headers, upstream's layout and name
          # (duckdb-static-libs-<platform>.tar.gz) so extension-ci-tools can use
          # it as a prebuilt engine and haybarn-go-bindings can vendor it.
          libs=""
          for l in $STATIC_LIBRARIES_UNIX; do libs="$libs build/release/$l"; done
          make static-libs-release-artifact ARTIFACT_SUFFIX=linux-$SUFFIX \
            STATIC_LIBRARIES="$libs $(ls build/release/extension/*/lib*_extension.a | tr '\n' ' ')"

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-linux-${{ env.SUFFIX }}
          path: |
            haybarn_cli-linux-*.zip
            haybarn_cli-linux-*.gz
            haybarn_unittest-linux-*.zip
            libhaybarn-linux-*.zip
            duckdb-static-libs-linux-*.tar.gz

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            haybarn_cli-linux-*.zip
            haybarn_cli-linux-*.gz
            haybarn_unittest-linux-*.zip
            libhaybarn-linux-*.zip
            duckdb-static-libs-linux-*.tar.gz

  osx:
    # Haybarn 2.0 ships macOS arm64 only (no x86_64, no universal binary).
    name: macOS (arm64)
    runs-on: macos-15
    env:
      EXTENSION_CONFIGS: '${{ github.workspace }}/.github/config/bundled_extensions.cmake'
      DUCKDB_CAPABILITIES: 'httplib loadable_extensions'
      OSX_BUILD_ARCH: arm64
      # Build the unittest binary with a portable root dir so the shipped
      # haybarn-unittest launches from any cwd (consumers pass --test-dir).
      EXTRA_CMAKE_VARIABLES: '-DUNITTEST_ROOT_DIRECTORY=.'
      GEN: ninja
      # DuckDB's CMake auto-detects ccache as the compiler launcher when it is
      # on PATH; CCACHE_DIR points it at the cached directory.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Tuning + remote backend (same Cloudflare Worker → R2 bucket as vcpkg).
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-release-osx-${{ github.sha }}
          restore-keys: |
            ccache-release-osx-

      - name: Install Ninja + ccache
        run: brew install ninja ccache

      - name: Build
        run: make

      - name: Verify architecture flags
        run: |
          grep -Fq -- '-mcpu=apple-m1' build/release/compile_commands.json
          ! grep -Fq -- '-Xarch_' build/release/compile_commands.json

      - name: Print platform
        run: ./build/release/haybarn -c "PRAGMA platform; PRAGMA version;"

      # NOTE: macOS code signing / notarization is intentionally not wired up
      # yet. When an Apple Developer ID is available, add a codesign +
      # `xcrun notarytool` step here using OSX_CODESIGN_* / OSX_NOTARIZE_*
      # secrets, signing build/release/haybarn and libhaybarn*.dylib.

      - name: Test
        if: ${{ inputs.skip_tests != 'true' }}
        run: |
          python3 -m pip install pytest
          python3 -m pytest tools/shell/tests --shell-binary build/release/haybarn

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          # Every shipped Mach-O must be arm64 only.
          for f in build/release/haybarn build/release/test/unittest build/release/src/libhaybarn*.dylib; do
            [[ -L "$f" ]] && continue
            lipo "$f" -verify_arch arm64
            ! lipo "$f" -verify_arch x86_64
          done
          zip -j -y libhaybarn-osx-arm64.zip build/release/src/libhaybarn*.dylib \
            src/include/duckdb.h src/include/duckdb_v2.h
          zip -j haybarn_cli-osx-arm64.zip build/release/haybarn
          gzip -9 -k -n -c build/release/haybarn > haybarn_cli-osx-arm64.gz
          # unittest binary (shipped as haybarn-unittest).
          mkdir -p build/release_arm64
          cp build/release/test/unittest build/release_arm64/haybarn-unittest
          zip -j haybarn_unittest-osx-arm64.zip build/release_arm64/haybarn-unittest
          static_libraries=()
          for library in $STATIC_LIBRARIES_UNIX build/release/extension/*/lib*_extension.a; do
            [[ "$library" == build/* ]] || library="build/release/$library"
            lipo "$library" -verify_arch arm64
            static_libraries+=("$library")
          done
          make static-libs-release-artifact ARTIFACT_SUFFIX=osx-arm64 STATIC_LIBRARIES="${static_libraries[*]}"

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-osx
          path: |
            haybarn_cli-osx-*.zip
            haybarn_cli-osx-*.gz
            haybarn_unittest-osx-*.zip
            libhaybarn-osx-arm64.zip
            duckdb-static-libs-osx-*.tar.gz

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            haybarn_cli-osx-*.zip
            haybarn_cli-osx-*.gz
            haybarn_unittest-osx-*.zip
            libhaybarn-osx-arm64.zip
            duckdb-static-libs-osx-*.tar.gz

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    runs-on: windows-2022
    env:
      # Upstream 2.0 builds Windows releases with clang-cl through
      # `make windows_release` (bundled_extensions.cmake, httplib +
      # loadable_extensions capabilities, Release, in-tree build directory).
      GEN: ninja
      CC: clang-cl
      CXX: clang-cl
      EXTRA_CMAKE_VARIABLES: '-DBUILD_UNITTESTS=1 -DUNITTEST_ROOT_DIRECTORY=.'
      # ccache R2 remote backend + tuning (same Cloudflare Worker / token as
      # Linux/macOS — content-addressed hashes mean cross-platform sharing for
      # the few translation units that actually overlap is free). ccache
      # recognizes clang-cl itself.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up MSVC environment (x64)
        uses: ./.github/actions/setup-msvc-env

      - name: Install ccache
        shell: pwsh
        run: choco install ccache --yes --no-progress

      - name: ccache (actions/cache for L1 persistence)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-release-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-release-windows-${{ matrix.arch }}-

      - name: Build
        shell: bash
        run: |
          clang-cl --version
          python scripts/windows_ci.py
          make windows_release
          ccache -s || true

      - name: Verify architecture flags
        shell: pwsh
        run: |
          $commands = Get-Content compile_commands.json -Raw
          if (!$commands.Contains('clang-cl')) {
            throw 'Windows amd64 Release compile commands are not using clang-cl'
          }
          if (!$commands.Contains('-march=haswell') -or !$commands.Contains('-mtune=generic')) {
            throw 'Windows amd64 Release compile commands are missing the CLI architecture flags'
          }
          # Haybarn: the static libs extensions link must not pool string literals
          # (CMakeLists.txt, duckdb/duckdb#27857).
          if (!$commands.Contains('/GF-')) {
            throw 'Windows amd64 Release compile commands are missing /GF- (string pooling off)'
          }

      # Smoke the unittest binary — confirm it both built and launches (the
      # -DUNITTEST_ROOT_DIRECTORY=. fix means it shouldn't chdir-throw).
      - name: Smoke test
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          ./haybarn.exe -c "PRAGMA platform; PRAGMA version;"
          UNITTEST="$(find test -name unittest.exe -type f | head -1)"
          if [[ -z "$UNITTEST" ]]; then echo "::error::unittest.exe not found under test/"; exit 1; fi
          echo "unittest.exe at: $UNITTEST"
          "$UNITTEST" --select-tag release

      # NOTE: Windows code signing (Azure Trusted Signing) is intentionally not
      # wired up yet. Add a signing step here over haybarn.exe and
      # src/haybarn.dll when AZURE_CODESIGN_* secrets are available.

      - name: Package
        shell: bash
        run: |
          7z a haybarn_cli-windows-${{ matrix.arch }}.zip ./haybarn.exe
          7z a libhaybarn-windows-${{ matrix.arch }}.zip \
            ./src/haybarn.dll ./src/haybarn.lib \
            ./src/include/duckdb.h ./src/include/duckdb_v2.h
          # unittest binary, shipped as haybarn-unittest via npm/PyPI.
          UNITTEST="$(find test -name unittest.exe -type f | head -1)"
          cp "$UNITTEST" haybarn-unittest.exe
          7z a haybarn_unittest-windows-${{ matrix.arch }}.zip ./haybarn-unittest.exe
          make static-libs-release-artifact ARTIFACT_SUFFIX=windows-${{ matrix.arch }} \
            STATIC_LIBRARIES="src/haybarn_static.lib src/duckdb_shell.lib src/main/http/duckdb_httplib.lib src/main/extension/duckdb_loadable_extensions.lib $(ls extension/*/*_extension.lib | tr '\n' ' ')"

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-windows-${{ matrix.arch }}
          path: |
            haybarn_cli-windows-*.zip
            haybarn_unittest-windows-*.zip
            libhaybarn-windows-*.zip
            duckdb-static-libs-windows-*.tar.gz

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            haybarn_cli-windows-*.zip
            haybarn_unittest-windows-*.zip
            libhaybarn-windows-*.zip
            duckdb-static-libs-windows-*.tar.gz

  # MinGW static libraries for cgo and MinGW extension builds (the clang-cl
  # .lib archives above are MSVC ABI). Mirrors
  # upstream's Windows.yml mingw job: Rtools42 gcc, `make release` with the
  # bundled extensions and capabilities. Ships no CLI or shared library.
  windows-mingw:
    name: Windows amd64 (MinGW static libs)
    runs-on: windows-2022
    env:
      GEN: ninja
      CC: C:/rtools42/x86_64-w64-mingw32.static.posix/bin/gcc.exe
      CXX: C:/rtools42/x86_64-w64-mingw32.static.posix/bin/g++.exe
      EXTENSION_CONFIGS: '${GITHUB_WORKSPACE}/.github/config/bundled_extensions.cmake'
      DUCKDB_CAPABILITIES: 'httplib loadable_extensions'
      EXTRA_CMAKE_VARIABLES: '-DUNITTEST_ROOT_DIRECTORY=.'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Rtools
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2.12.1
        with:
          r-version: devel
          update-rtools: true
          rtools-version: '42'

      - name: Install ccache and make
        shell: pwsh
        run: choco install ccache make --yes --no-progress

      - name: ccache (actions/cache for L1 persistence)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-release-windows-mingw-${{ github.sha }}
          restore-keys: |
            ccache-release-windows-mingw-

      - name: Build environment
        shell: bash
        run: |
          {
            # bash from Git
            echo 'C:/Program Files/Git/bin'
            # make, ninja and ccache from Chocolatey
            echo 'C:/ProgramData/Chocolatey/bin'
            # gcc and g++ from Rtools42
            echo 'C:/rtools42/x86_64-w64-mingw32.static.posix/bin'
          } >> "${GITHUB_PATH}"

      - name: Build
        shell: bash
        run: |
          g++ --version | head -1
          python scripts/ci/retry.py -- make release
          ccache -s || true

      - name: Smoke test
        if: ${{ inputs.skip_tests != 'true' }}
        shell: bash
        run: |
          ./build/release/haybarn.exe -c "PRAGMA platform; PRAGMA version;"
          ./build/release/test/unittest.exe --select-tag release

      - name: Package
        shell: bash
        run: |
          make static-libs-release-artifact ARTIFACT_SUFFIX=windows-amd64-mingw \
            STATIC_LIBRARIES="build/release/src/libhaybarn_static.a build/release/src/libduckdb_shell.a build/release/src/main/http/libduckdb_httplib.a build/release/src/main/extension/libduckdb_loadable_extensions.a $(ls build/release/extension/*/lib*_extension.a | tr '\n' ' ')"

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-windows-amd64-mingw
          path: duckdb-static-libs-windows-amd64-mingw.tar.gz
          if-no-files-found: error

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: duckdb-static-libs-windows-amd64-mingw.tar.gz

  # DuckDB 2.0 dropped the amalgamation; like upstream's libduckdb-src.zip this
  # now carries the C API headers.
  src-headers:
    name: libhaybarn C headers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Package headers
        run: |
          zip -j libhaybarn-src.zip \
            src/include/duckdb.h src/include/duckdb_v2.h \
            src/include/duckdb_extension.h src/include/duckdb_extension_v2.h
      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-src
          path: libhaybarn-src.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: libhaybarn-src.zip

  # Haybarn's counterpart of upstream's staging upload: extension-ci-tools
  # (haybarn-2.0 ci_phase.py) fetches
  #   <base>/<commit10>/latest_alpha_version.txt and
  #   <base>/<commit10>/<version>/duckdb/duckdb/github_release/duckdb-static-libs-<platform>.tar.gz
  # from https://haybarn-extensions.query.farm/staging. Objects are keyed by the
  # engine commit, so re-staging a commit only replaces identical builds.
  stage-prebuilt:
    name: Stage prebuilt engine
    needs: [linux, osx, windows, windows-mingw]
    if: ${{ startsWith(github.ref, 'refs/tags/haybarn-v') || inputs.stage_prebuilt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Test staging contract
        run: python3 -m unittest scripts.ci.test_stage_prebuilt

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: haybarn-*
          merge-multiple: true

      - name: Upload to R2 staging
        shell: bash
        env:
          AWS_ENDPOINT_URL:      ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          # The org secret holding the secret half is named R2_SECRET_KEY_ID.
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY_ID }}
          AWS_DEFAULT_REGION:    auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/ci/stage_prebuilt.sh

  # GitHub Release for haybarn-v2.* tags (dry run otherwise). Runs inside this
  # run, so it raises no workflow_run event and never wakes the 1.5-line
  # haybarn-publish / npm / PyPI chain. The 2.0 line publishes to GitHub
  # Releases only for now; npm and PyPI follow once a 2.0 rc is verified.
  github-release:
    name: GitHub Release
    needs: [linux, osx, windows, windows-mingw, src-headers]
    uses: ./.github/workflows/haybarn-github-release.yml
    permissions:
      contents: write
    secrets: inherit
    with:
      tag: ${{ startsWith(github.ref, 'refs/tags/haybarn-v') && github.ref_name || '' }}

  # The npm and PyPI CLI/unittest publishers. They must run as top-level
  # workflows (npm and PyPI Trusted Publishers name the workflow file), and
  # workflow_run would start the default (1.5) branch's copies, so dispatch
  # the copies at the release tag.
  publish-registries:
    name: Start npm + PyPI publishers
    needs: github-release
    if: ${{ startsWith(github.ref, 'refs/tags/haybarn-v2.') }}
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch publishers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          for wf in haybarn-npm-publish.yml haybarn-npm-unittest-publish.yml \
                    haybarn-pypi-cli-publish.yml haybarn-pypi-unittest-publish.yml; do
            gh workflow run "$wf" -R "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
            echo "::notice::dispatched $wf for $TAG"
          done
