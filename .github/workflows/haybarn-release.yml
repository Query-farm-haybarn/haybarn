# Haybarn: builds the `haybarn` CLI and `libhaybarn` libraries for all release
# platforms. Self-contained (does not reuse DuckDB's S3-staging-coupled release
# workflows). Artifacts are uploaded for the haybarn-publish workflow to sign
# and attach to a GitHub Release.
name: Haybarn Release

on:
  push:
    tags:
      - 'haybarn-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      override_git_describe:
        description: 'Version string to embed (defaults to the upstream tag, e.g. v1.5.2)'
        type: string
      skip_tests:
        description: 'Pass "true" to skip tests'
        type: string

concurrency:
  group: haybarn-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write       # OIDC for build-provenance attestation signing
  attestations: write   # write to the GitHub attestations API
  contents: read

env:
  # Haybarn is built from a specific upstream DuckDB tag. The version string the
  # binary reports stays the upstream version (e.g. v1.5.2) for storage and
  # extension-path compatibility; see the plan's branding decisions.
  OVERRIDE_GIT_DESCRIBE: ${{ inputs.override_git_describe || 'v1.5.2' }}
  # Haybarn-specific version string that drives the startup banner + `-version`
  # flag (distinct from the upstream OVERRIDE_GIT_DESCRIBE above which dictates
  # storage compat). On tag push (`refs/tags/haybarn-v...`) GITHUB_REF_NAME is
  # the tag itself ("haybarn-v1.5.2-rc1"); on workflow_dispatch it's empty, and
  # CMake will derive it from `git describe --match 'haybarn-v*'` instead.
  HAYBARN_GIT_DESCRIBE: ${{ startsWith(github.ref, 'refs/tags/haybarn-v') && github.ref_name || '' }}

jobs:
  linux:
    name: Linux ${{ matrix.config.arch }}${{ matrix.config.libc == 'musl' && '-musl' || '' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { runner: ubuntu-24.04,     arch: amd64, image: x86_64,  libc: glibc }
          - { runner: ubuntu-24.04-arm,  arch: arm64, image: aarch64, libc: glibc }
          - { runner: ubuntu-24.04,     arch: amd64,                 libc: musl  }
          - { runner: ubuntu-24.04-arm,  arch: arm64,                 libc: musl  }
    runs-on: ${{ matrix.config.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Persist the ccache directory across runs. The docker builds set
      # CCACHE_DIR=$PWD/.ccache and bind-mount $PWD, so .ccache in the workspace
      # is the cache. Without this every release build is a cold full recompile.
      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-release-linux-${{ matrix.config.arch }}-${{ matrix.config.libc }}-${{ github.sha }}
          restore-keys: |
            ccache-release-linux-${{ matrix.config.arch }}-${{ matrix.config.libc }}-

      # Phase A images already have cmake, ninja, ccache 4.13.6, perl-IPC-Cmd,
      # git, and the full build toolchain pre-installed (built from
      # haybarn-extension-ci-tools/docker/<arch>{,_musl}/Dockerfile). The
      # release build only needs in-tree C++ extensions (no Rust/ODBC), so
      # the `base` variant is sufficient. ~2-3 min of dnf/apk/curl setup per
      # leg → ~30s of docker pull.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pick GHCR image for this matrix leg
        id: image
        shell: bash
        run: |
          # Image taxonomy: haybarn-linux_<arch>{,_musl}-base:<engine_version>
          case "${{ matrix.config.libc }}" in
            glibc) suffix='' ;;
            musl)  suffix='_musl' ;;
          esac
          echo "ref=ghcr.io/query-farm-haybarn/haybarn-linux_${{ matrix.config.arch }}${suffix}-base:v1.5.2" >> "$GITHUB_OUTPUT"

      - name: Build (Linux glibc + musl, pre-built image)
        shell: bash
        env:
          CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
        run: |
          export WORKSPACE="$(pwd)"
          docker pull "${{ steps.image.outputs.ref }}"
          # `-w "$WORKSPACE"` sets the container's working directory to the
          # bind-mounted host path. Without this, the Phase A image's
          # WORKDIR /duckdb_build_dir takes effect — and `$PWD` inside the
          # bash command resolves there, missing the Makefile. (First run
          # of this code failed with: `make: No targets specified and no
          # makefile found. Stop. make: Entering directory '/duckdb_build_dir'`.)
          # We also pass WORKSPACE explicitly so the bash command uses it
          # rather than relying on $PWD (less fragile).
          docker run \
            -v"$WORKSPACE":"$WORKSPACE" \
            -w "$WORKSPACE" \
            -e GEN=ninja \
            -e CC='ccache gcc' -e CXX='ccache g++' -e CCACHE_DIR="$WORKSPACE/.ccache" \
            -e CCACHE_BASEDIR="$WORKSPACE" -e CCACHE_NOHASHDIR=1 \
            -e CCACHE_SLOPPINESS=time_macros,include_file_mtime,pch_defines \
            -e CCACHE_COMPILERCHECK=content \
            -e CCACHE_REMOTE_STORAGE \
            -e OVERRIDE_GIT_DESCRIBE="$OVERRIDE_GIT_DESCRIBE" \
            -e HAYBARN_GIT_DESCRIBE \
            -e EXTENSION_CONFIGS="$WORKSPACE/.github/config/in_tree_extensions.cmake" \
            -e ENABLE_EXTENSION_AUTOLOADING=1 -e ENABLE_EXTENSION_AUTOINSTALL=1 \
            -e WORKSPACE="$WORKSPACE" \
            "${{ steps.image.outputs.ref }}" \
            bash -c 'set -e; \
                     ccache --version; \
                     git config --global --add safe.directory "$WORKSPACE"; \
                     make -C "$WORKSPACE"; \
                     ccache -s'

      # musl binaries are built inside Alpine and won't run on the glibc host
      # runner, so steps that *execute* the binary are glibc-only. The musl
      # binary is still built and packaged below. (TODO: run musl smoke
      # tests inside the alpine container.)
      - name: Print platform
        if: matrix.config.libc != 'musl'
        run: ./build/release/haybarn -c "PRAGMA platform;"

      # Release builds run a fast smoke test only: the `release`-tagged unittest
      # subset plus the shell tests and a basic query. The full unit-test suite
      # (~2h/platform) belongs in a separate test workflow, not the release path.
      - name: Smoke test
        if: ${{ inputs.skip_tests != 'true' && matrix.config.libc != 'musl' }}
        shell: bash
        run: |
          python3 -m pip install pytest
          ./build/release/test/unittest --select-tag release
          python3 -m pytest tools/shell/tests --shell-binary build/release/haybarn
          ./build/release/haybarn -c "SELECT 42 AS answer; PRAGMA version;"

      - name: Package
        shell: bash
        run: |
          SUFFIX="${{ matrix.config.arch }}${{ matrix.config.libc == 'musl' && '-musl' || '' }}"
          python3 scripts/amalgamation.py
          zip -j haybarn_cli-linux-$SUFFIX.zip build/release/haybarn
          gzip -9 -k -n -c build/release/haybarn > haybarn_cli-linux-$SUFFIX.gz
          zip -j libhaybarn-linux-$SUFFIX.zip build/release/src/libhaybarn*.* \
            src/amalgamation/duckdb.hpp src/include/duckdb.h

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-linux-${{ matrix.config.arch }}${{ matrix.config.libc == 'musl' && '-musl' || '' }}
          path: |
            haybarn_cli-linux-*.zip
            haybarn_cli-linux-*.gz
            libhaybarn-linux-*.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            haybarn_cli-linux-*.zip
            haybarn_cli-linux-*.gz
            libhaybarn-linux-*.zip

  osx:
    name: macOS (universal)
    runs-on: macos-15
    env:
      EXTENSION_CONFIGS: '${{ github.workspace }}/.github/config/in_tree_extensions.cmake'
      ENABLE_EXTENSION_AUTOLOADING: 1
      ENABLE_EXTENSION_AUTOINSTALL: 1
      OSX_BUILD_UNIVERSAL: 1
      GEN: ninja
      # DuckDB's CMake auto-detects ccache as the compiler launcher when it is
      # on PATH; CCACHE_DIR points it at the cached directory.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Tuning + remote backend (same Cloudflare Worker → R2 bucket as vcpkg).
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ccache
        uses: actions/cache@v5
        with:
          path: .ccache
          key: ccache-release-osx-${{ github.sha }}
          restore-keys: |
            ccache-release-osx-

      - name: Install Ninja + ccache
        run: brew install ninja ccache

      - name: Build
        run: make

      - name: Print platform
        run: ./build/release/haybarn -c "PRAGMA platform;"

      # NOTE: macOS code signing / notarization is intentionally not wired up
      # yet. When an Apple Developer ID is available, add a codesign +
      # `xcrun notarytool` step here using OSX_CODESIGN_* / OSX_NOTARIZE_*
      # secrets, signing build/release/haybarn and libhaybarn*.dylib.

      - name: Test
        if: ${{ inputs.skip_tests != 'true' }}
        run: |
          python3 -m pip install pytest
          python3 -m pytest tools/shell/tests --shell-binary build/release/haybarn

      - name: Package
        shell: bash
        run: |
          python3 scripts/amalgamation.py
          zip -j -y libhaybarn-osx-universal.zip build/release/src/libhaybarn*.dylib \
            src/amalgamation/duckdb.hpp src/include/duckdb.h
          mkdir build/release_arm64 build/release_amd64
          lipo -extract arm64  -output build/release_arm64/haybarn  build/release/haybarn
          lipo -extract x86_64 -output build/release_amd64/haybarn  build/release/haybarn
          zip -j haybarn_cli-osx-universal.zip build/release/haybarn
          zip -j haybarn_cli-osx-arm64.zip     build/release_arm64/haybarn
          zip -j haybarn_cli-osx-amd64.zip     build/release_amd64/haybarn
          gzip -9 -k -n -c build/release/haybarn        > haybarn_cli-osx-universal.gz
          gzip -9 -k -n -c build/release_arm64/haybarn  > haybarn_cli-osx-arm64.gz
          gzip -9 -k -n -c build/release_amd64/haybarn  > haybarn_cli-osx-amd64.gz

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-osx
          path: |
            haybarn_cli-osx-*.zip
            haybarn_cli-osx-*.gz
            libhaybarn-osx-universal.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            haybarn_cli-osx-*.zip
            haybarn_cli-osx-*.gz
            libhaybarn-osx-universal.zip

  windows:
    name: Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64]
    runs-on: windows-2022
    env:
      EXTENSION_CONFIGS: '.github/config/in_tree_extensions.cmake'
      ENABLE_EXTENSION_AUTOLOADING: 1
      ENABLE_EXTENSION_AUTOINSTALL: 1
      # ccache R2 remote backend + tuning (same Cloudflare Worker / token as
      # Linux/macOS — content-addressed hashes mean cross-platform sharing for
      # the few translation units that actually overlap is free). MSVC support
      # in ccache landed in 4.6 and has been solid since 4.8; chocolatey ships
      # a recent version.
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_NOHASHDIR: "1"
      CCACHE_SLOPPINESS: "time_macros,include_file_mtime,pch_defines"
      CCACHE_COMPILERCHECK: "content"
      CCACHE_COMPILERTYPE: "msvc"
      CCACHE_REMOTE_STORAGE: "http://haybarn-vcpkg-cache.rusty-bb6.workers.dev/ccache|bearer-token=${{ secrets.HAYBARN_VCPKG_TOKEN }}|connect-timeout=10000|operation-timeout=30000"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # CMAKE_CXX_COMPILER_LAUNCHER only works with Ninja/Make generators
      # (MSBuild silently ignores it), so the Windows build switches from
      # the default Visual Studio generator → Ninja Multi-Config. That
      # requires cl.exe + nmake on PATH, which msvc-dev-cmd provides.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install ccache
        shell: pwsh
        run: choco install ccache --yes --no-progress

      - name: ccache (actions/cache for L1 persistence)
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-release-windows-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-release-windows-${{ matrix.arch }}-

      - name: Build
        shell: bash
        run: |
          python scripts/windows_ci.py
          cmake -G "Ninja Multi-Config" \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_UNITTESTS=0 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEXTENSION_CONFIGS=.github/config/in_tree_extensions.cmake \
            -DENABLE_EXTENSION_AUTOLOADING=1 -DENABLE_EXTENSION_AUTOINSTALL=1 \
            -DOVERRIDE_GIT_DESCRIBE="$OVERRIDE_GIT_DESCRIBE" -B build .
          cmake --build build --config Release
          ccache -s

      # NOTE: Windows code signing (Azure Trusted Signing) is intentionally not
      # wired up yet. Add a signing step here over build/Release/haybarn.exe and
      # build/src/Release/haybarn.dll when AZURE_CODESIGN_* secrets are available.

      - name: Package
        shell: bash
        run: |
          python scripts/amalgamation.py
          7z a haybarn_cli-windows-${{ matrix.arch }}.zip ./build/Release/haybarn.exe
          7z a libhaybarn-windows-${{ matrix.arch }}.zip \
            ./build/src/Release/haybarn.dll ./build/src/Release/haybarn.lib \
            ./src/amalgamation/duckdb.hpp ./src/include/duckdb.h

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-windows-${{ matrix.arch }}
          path: |
            haybarn_cli-windows-*.zip
            libhaybarn-windows-*.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            haybarn_cli-windows-*.zip
            libhaybarn-windows-*.zip

  src-amalgamation:
    name: libhaybarn source amalgamation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build amalgamation
        run: |
          python3 scripts/amalgamation.py
          zip -j libhaybarn-src.zip \
            src/amalgamation/duckdb.hpp src/amalgamation/duckdb.cpp \
            src/include/duckdb.h src/include/duckdb_extension.h
      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-src
          path: libhaybarn-src.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: libhaybarn-src.zip
# Haybarn fork — workflow re-index marker.
