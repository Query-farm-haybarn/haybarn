# Reusable + dispatchable workflow that publishes the core extension
# build's pre-staged pip wheels + npm packages to PyPI / npm.
#
# Two modes:
#
#   1. workflow_call from haybarn-extensions.yml after the publish job
#      finishes staging artifacts in the same run.
#
#   2. workflow_dispatch for manual retry — when PyPI's anti-spam
#      "too many new projects" rate limit (sticky for hours) bounces
#      an earlier publish, or when npm has a transient hiccup. Pass
#      source_run_id pointing at the build run whose artifacts to
#      republish. download-artifact uses run-id + github-token to pull
#      cross-run.
#
# publish_pypi and publish_npm are independent jobs — either can fail
# without blocking the other, so a PyPI rate-limit hit doesn't kill
# the npm side.
#
# Retry recipe:
#   gh workflow run "_extension_registry_publish.yml" \\
#     --repo Query-farm-haybarn/haybarn --ref main \\
#     -f source_run_id=<the build run id>

name: Extension Registry Publish (core)
on:
  workflow_call:
    inputs:
      source_run_id:
        required: false
        type: string
        default: ''     # empty → same run; set → cross-run download
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Build run ID whose core-pypi-wheels + core-npm-packages artifacts to republish'
        required: true
        type: string

jobs:
  # ------------------------------------------------------------------
  # PyPI publish — takes the bundled core-pypi-wheels artifact and
  # uploads the whole directory in one twine call. Partial 429
  # failures during the upload are reported via the action's verbose
  # output; this job failing does NOT block publish_npm.
  # ------------------------------------------------------------------
  publish_pypi:
    name: Publish PyPI (core)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions:  read     # cross-run download-artifact
      id-token: write    # PEP 740 attestations
    concurrency:
      group: registry-publish-core-pypi
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-pypi-wheels
          path: dist/
          # When source_run_id is empty, falls back to the current run's id.
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - run: ls -la dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.HAYBARN_PYPI_TOKEN }}
          attestations: true
          skip-existing: true
          verbose: true

  # ------------------------------------------------------------------
  # npm publish — leaves first, then metas. EEXIST-tolerant. Same
  # logic as the previous in-line job; independent of publish_pypi.
  # ------------------------------------------------------------------
  publish_npm:
    name: Publish npm (core)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions:  read
      id-token: write    # --provenance attestations
    concurrency:
      group: registry-publish-core-npm
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@v4
        with:
          name: core-npm-packages
          path: dist/
          run-id: ${{ inputs.source_run_id != '' && inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: List staged packages
        run: |
          echo "leaves:"; ls dist/npm-leaves/ 2>/dev/null || echo "(none)"
          echo "metas:"; ls dist/npm-metas/  2>/dev/null || echo "(none)"

      - name: Publish leaves
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.HAYBARN_NPM_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          n_ok=0; n_skip=0; n_fail=0
          for leaf in dist/npm-leaves/*/; do
            [[ -d "$leaf" ]] || continue
            pkg=$(python3 -c "import json; print(json.load(open('$leaf/package.json'))['name'])")
            ver=$(python3 -c "import json; print(json.load(open('$leaf/package.json'))['version'])")
            echo "::group::$pkg@$ver"
            if (cd "$leaf" && npm publish --provenance --access public --tag latest 2>/tmp/npm.err); then
              n_ok=$((n_ok+1))
              echo "  → published"
            elif grep -qiE 'previously published|EPUBLISHCONFLICT|cannot publish over' /tmp/npm.err; then
              n_skip=$((n_skip+1))
              echo "  → already published, skipping"
            else
              n_fail=$((n_fail+1))
              cat /tmp/npm.err
              echo "::error::publish failed for $pkg@$ver"
            fi
            echo "::endgroup::"
          done
          echo "leaves: ok=$n_ok skip=$n_skip fail=$n_fail"
          [[ $n_fail -eq 0 ]]

      - name: Publish metas
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.HAYBARN_NPM_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          n_ok=0; n_skip=0; n_fail=0
          for meta in dist/npm-metas/*/; do
            [[ -d "$meta" ]] || continue
            pkg=$(python3 -c "import json; print(json.load(open('$meta/package.json'))['name'])")
            ver=$(python3 -c "import json; print(json.load(open('$meta/package.json'))['version'])")
            echo "::group::$pkg@$ver"
            if (cd "$meta" && npm publish --provenance --access public --tag latest 2>/tmp/npm.err); then
              n_ok=$((n_ok+1))
              echo "  → published"
            elif grep -qiE 'previously published|EPUBLISHCONFLICT|cannot publish over' /tmp/npm.err; then
              n_skip=$((n_skip+1))
              echo "  → already published, skipping"
            else
              n_fail=$((n_fail+1))
              cat /tmp/npm.err
              echo "::error::publish failed for $pkg@$ver"
            fi
            echo "::endgroup::"
          done
          echo "metas: ok=$n_ok skip=$n_skip fail=$n_fail"
          [[ $n_fail -eq 0 ]]
