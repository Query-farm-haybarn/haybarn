# Marks all changed PR as draft
name: Draft on Synchronize
on:
  # Haybarn: upstream auto-triggers removed so this workflow
  # does not run on the fork. Still runnable manually if needed.
  workflow_dispatch:
concurrency:
  group: shouldturntodraft-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  mark-as-draft:
    name: Mark as draft
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Save PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.node_id }}
        run: |
          mkdir -p ./pr
          echo $PR_NUMBER > ./pr/pr_number
      - uses: actions/upload-artifact@v4
        with:
          name: pr_number
          path: pr/
# Haybarn fork — workflow re-index marker.
