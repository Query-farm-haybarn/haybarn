name: Bundle Static Libraries
on:
  # Haybarn: upstream auto-triggers removed so this workflow
  # does not run on the fork. Still runnable manually if needed.
  workflow_dispatch:
  workflow_call:
    inputs:
      override_git_describe:
        type: string
      git_ref:
        type: string
      skip_tests:
        type: string
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}-${{ inputs.override_git_describe }}
  cancel-in-progress: true

permissions:
  id-token: write       # OIDC for build-provenance attestation signing
  attestations: write   # write to the GitHub attestations API
  contents: read

env:
  # Stamp a clean release version (no git-describe `-dev` suffix) so the engine
  # baked into libhaybarn_static.a resolves INSTALL/LOAD under the release
  # extension dir (haybarn-extensions.query.farm/core/v1.5.4), not a SHA. Same
  # lesson as the Rust crate's amalgamation regen.
  OVERRIDE_GIT_DESCRIBE: ${{ inputs.override_git_describe || 'v1.5.4' }}

jobs:
  bundle-osx-static-libs:
    name: OSX static libs
    strategy:
      matrix:
        include:
          - xcode_target_flag: "x86_64"
            architecture: "amd64"
          - xcode_target_flag: "arm64"
            architecture: "arm64"
    runs-on: macos-latest
    env:
      EXTENSION_CONFIGS: '${GITHUB_WORKSPACE}/.github/config/bundled_extensions.cmake'
      ENABLE_EXTENSION_AUTOLOADING: 1
      ENABLE_EXTENSION_AUTOINSTALL: 1
      GEN: ninja
      OSX_BUILD_ARCH: ${{ matrix.xcode_target_flag }}
      DUCKDB_PLATFORM: osx_${{ matrix.architecture }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: brew install ninja

      - uses: ./.github/actions/ccache-action

      - name: Build
        shell: bash
        run: make

      - name: Bundle static library
        shell: bash
        run: |
          make gather-libs

      - name: Bundle zip
        shell: bash
        run: |
          python3 scripts/amalgamation.py
          zip -r -j static-libs-osx-${{ matrix.architecture }}.zip src/include/duckdb.h build/release/libs/

      # Named `haybarn-*` so the Haybarn Publish workflow's `pattern: haybarn-*`
      # download collects it, checksums + GPG-signs it, and attaches it to the
      # GitHub Release alongside the CLI/lib zips. v7 backend to match
      # haybarn-release.yml's upload-artifact (download-artifact@v8 in publish
      # cannot read the old v4 backend).
      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-static-libs-osx-${{ matrix.architecture }}
          path: static-libs-osx-${{ matrix.architecture }}.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: static-libs-osx-${{ matrix.architecture }}.zip

  bundle-mingw-static-lib:
    name: Windows MingW static libs
    runs-on: windows-latest
    env:
      GEN: ninja
      EXTENSION_CONFIGS: '${GITHUB_WORKSPACE}/.github/config/bundled_extensions.cmake'
      ENABLE_EXTENSION_AUTOLOADING: 1
      ENABLE_EXTENSION_AUTOINSTALL: 1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies
        shell: bash
        run: |
          choco install \
            ccache \
            make \
            ninja \
            zip \
            --no-progress
          choco install \
            mingw --version 14.2.0 \
            --no-progress

      - uses: ./.github/actions/ccache-action

      - name: Build Environment
        shell: bash
        run: |
          # bash from Git
          echo 'C:/Program Files/Git/bin' >> "${GITHUB_PATH}"
          # make, ninja and ccache from Chocolatey
          echo 'C:/ProgramData/Chocolatey/bin' >> "${GITHUB_PATH}"
          # g++ from Chocolatey
          echo 'C:/ProgramData/mingw64/mingw64/bin' >> "${GITHUB_PATH}"

      - name: Build Environment Check
        shell: cmd
        run: |
          where bash
          bash --version
          where make
          make --version
          where ninja
          ninja --version
          where ccache
          ccache --version
          where g++
          g++ --version
          echo %PATH%

      - name: Bundle static library
        shell: cmd
        run: |
          make gather-libs

      - name: Bundle zip
        shell: bash
        run: |
          zip -r -j static-libs-windows-mingw.zip src/include/duckdb.h build/release/libs/

      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-static-libs-windows-mingw
          path: static-libs-windows-mingw.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: static-libs-windows-mingw.zip

  bundle-linux-static-libs:
    strategy:
      fail-fast: false
      matrix:
        config: [ { runner: ubuntu-latest, arch: amd64, image: x86_64 }, { runner: ubuntu-24.04-arm, arch: arm64, image: aarch64 } ]

    name: Linux Static Libraries (${{ matrix.config.arch }})
    runs-on: ${{ matrix.config.runner }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_ref }}

      - name: Build
        shell: bash
        run: |
          export PWD=`pwd`
          docker run                                                             \
          -v$PWD:$PWD                                                            \
          -e CMAKE_BUILD_PARALLEL_LEVEL=2                                        \
          -e OVERRIDE_GIT_DESCRIBE=$OVERRIDE_GIT_DESCRIBE                        \
          -e EXTENSION_CONFIGS="$PWD/.github/config/bundled_extensions.cmake"    \
          -e ENABLE_EXTENSION_AUTOLOADING=1                                      \
          -e ENABLE_EXTENSION_AUTOINSTALL=1                                      \
          -e BUILD_BENCHMARK=1                                                   \
          -e FORCE_WARN_UNUSED=1                                                 \
          -e EXPORT_DYNAMIC_SYMBOLS=1                                            \
          quay.io/pypa/manylinux_2_28_${{ matrix.config.image }}                 \
          bash -c "
            set -e
            yum install -y perl-IPC-Cmd gcc-toolset-12 gcc-toolset-12-gcc-c++
            
            source /opt/rh/gcc-toolset-12/enable
            export CC=gcc
            export CXX=g++

            git config --global --add safe.directory $PWD
            make gather-libs -C $PWD
          "
      - name: Print platform
        shell: bash
        run: ./build/release/haybarn -c "PRAGMA platform;"

      - name: Bundle zip
        shell: bash
        run: |
          python3 scripts/amalgamation.py
          zip -r -j static-libs-linux-${{ matrix.config.arch }}.zip src/include/duckdb.h build/release/libs/
      - uses: actions/upload-artifact@v7
        with:
          name: haybarn-static-libs-linux-${{ matrix.config.arch }}
          path: static-libs-linux-${{ matrix.config.arch }}.zip

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: static-libs-linux-${{ matrix.config.arch }}.zip
# Haybarn fork — workflow re-index marker.
