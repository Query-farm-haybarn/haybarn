# Marks all changed PR as draft
name: Placeholder to cancel auto draft
on:
  # Haybarn: upstream auto-triggers removed so this workflow
  # does not run on the fork. Still runnable manually if needed.
  workflow_dispatch:
concurrency:
  group: shouldturntodraft-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  mark-as-draft:
    name: Placeholder
    if: github.event.pull_request.draft == true
    runs-on: ubuntu-latest
    steps:
      - name: Print PR number
        env:
          PR_NUMBER: ${{ github.event.pull_request.node_id }}
        run: |
          echo $PR_NUMBER
